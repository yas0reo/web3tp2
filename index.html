<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web3tp2</title>
    <link
      rel="stylesheet"
      href="./node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="./node_modules/bootstrap-icons/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/src/css/style.css" />

    <script type="importmap">
      {
        "imports": {
          "animejs": "./node_modules/animejs/dist/bundles/anime.esm.min.js",
          "chart.js/auto": "./node_modules/chart.js/auto/auto.js",
          "@kurkle/color": "./node_modules/@kurkle/color/dist/color.esm.js",
          "typed.js": "./node_modules/typed.js/dist/typed.module.js",
          "vfx-js": "https://esm.sh/@vfx-js/core",
          "zzz": "https://esm.sh/zdog"
        }
      }
    </script>
    <script src="/src/js/zdog.js" type="module"></script>
    <script src="/src/js/maplibre.js" type="module"></script>
    <script src="/src/js/vfx.js" type="module"></script>
    <script src="/src/js/typejs.js" type="module"></script>
    <script src="/src/js/tonejs.js" type="module"></script>
    <script src="/src/js/animejs.js" type="module"></script>
    <script src="/src/js/chartjs.js" type="module"></script>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/src/js/bootstrap.js" defer></script>
  </head>
  <body>
    <main class="hud-layout">
      <div class="hud-item other-members">
        <div class="dropdown">
          <button
            class="btn btn-primary dropdown-toggle"
            type="button"
            id="dropdownMenuButton"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Aespa Members
          </button>
          <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
            <li><a class="dropdown-item" href="#">Gisellle</a></li>
            <li><a class="dropdown-item" href="#">Karina </a></li>
            <li><a class="dropdown-item" href="#">Ningning</a></li>
            <li><a class="dropdown-item" href="#">Winter</a></li>
          </ul>
        </div>
      </div>

      <div class="hud-item icon">
        <div class="icons">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-arrow-right"
            viewBox="0 0 16 16"
          >
            <path
              class="fly"
              d="M3.468 1.948C5.303 3.325 7.276 6.118 8 7.616c.725-1.498 2.698-4.29 4.532-5.668C13.855.955 16 .186 16 2.632c0 .489-.28 4.105-.444 4.692-.572 2.04-2.653 2.561-4.504 2.246 3.236.551 4.06 2.375 2.281 4.2-3.376 3.464-4.852-.87-5.23-1.98-.07-.204-.103-.3-.103-.218 0-.081-.033.014-.102.218-.379 1.11-1.855 5.444-5.231 1.98-1.778-1.825-.955-3.65 2.28-4.2-1.85.315-3.932-.205-4.503-2.246C.28 6.737 0 3.12 0 2.632 0 .186 2.145.955 3.468 1.948"
            />
          </svg>
        </div>
      </div>

      <div class="hud-item aespa">
        <div class="logo">
          <img class="effect" src="/assets/img/logo.jpeg" alt="" />
        </div>
      </div>

      <div class="hud-item person-info">
        <p>
          <span id="typedjs-elem"></span>
        </p>
      </div>

      <div class="hud-item audio">
        <button class="btn btn-primary" id="playAudio">
          <i class="bi bi-file-earmark-music"></i> Ningning (solo)
        </button>
      </div>

      <div class="hud-item map">
        <div id="carte"></div>
      </div>

      <div class="hud-item full-body">
        <video id="ningning" autoplay muted loop playsinline>
          <source src="/assets/video/ningning_video.MOV" type="video/mp4" />
        </video>
      </div>

      <div class="hud-item look">
        <canvas class="zdog-canvas"></canvas>
      </div>

      <div class="hud-item other-pictures">
        <div class="NingNingImg">
          <img
            class="effect"
            src="/assets/img/ningning/ningning08.jpg"
            alt=""
          />
        </div>
      </div>

      <div class="hud-item chart">
        <canvas class="charte"></canvas>
      </div>

      <div class="hud-item footers">
        <div class="b-example-divider"></div>
        <div class="container">
          <footer class="py-3 my-4">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
              <li class="nav-item">
                <a href="#" class="nav-link px-2 text-body-secondary">Home</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link px-2 text-body-secondary"
                  >Giselle</a
                >
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link px-2 text-body-secondary">Karina</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link px-2 text-body-secondary"
                  >Ningning</a
                >
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link px-2 text-body-secondary">Winter</a>
              </li>
            </ul>
            <p class="text-center text-body-secondary">
              &copy; 2025 yas0reo, Inc
            </p>
          </footer>
        </div>
      </div>
    </main>
  </body>
</html>
